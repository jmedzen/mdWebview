name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}

      # 先建一份 amd64 映像在本機跑起來：確認帳號資料庫能建立（權限正確）、/api/health 回 200，
      # 通過才推送。寄信用 log 模式，不需要任何金鑰。
      - name: Smoke test image (accounts database and health check)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mdwebview:smoke
          cache-from: type=gha

      - name: Run smoke test
        run: |
          mkdir -p smoke-data
          docker run -d --name mdw-smoke -p 8330:8330 \
            -e MAIL_PROVIDER=log -e PUBLIC_BASE_URL=http://127.0.0.1:8330 \
            -v "$PWD/smoke-data:/data" mdwebview:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8330/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8330/api/health | grep -q '"accounts":true'
          curl -fsS http://127.0.0.1:8330/api/auth/config | grep -q '"accountsEnabled":true'
          test -f smoke-data/users.db
          docker logs mdw-smoke 2>&1 | tail -20
          docker rm -f mdw-smoke

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
