[package]
name = "mdwebview"
version = "3.9.1"
description = "mdWebview — 佛典經論閱讀器"
authors = ["mdWebview"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Keep the shipped binary small and fast; the real payload is the Node sidecar.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
